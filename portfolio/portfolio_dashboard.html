<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포트폴리오 수익률 대시보드</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@600;700;800&display=swap');
  :root{
    --bg:#0e1013; --panel:#161a20; --panel2:#1b2027; --border:#272d37;
    --text:#e9e7e1; --muted:#888f9b; --faint:#5b626d; --gold:#e0b35c;
    --up:#f24b5f; --down:#3d82f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard',system-ui,sans-serif;padding:26px}
  h1{font-family:'Archivo',sans-serif;font-size:28px;margin:4px 0 0;letter-spacing:-.02em}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .lbl{color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  button{font-family:'Pretendard',sans-serif;cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text)}
  .btn.p{background:var(--gold);color:#000;border-color:var(--gold)}
  input,select{font-family:'IBM Plex Mono',monospace;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;outline:none}
  select{font-family:'Pretendard',sans-serif}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--muted);font-size:11px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:7px 10px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  .cellin{width:80px;text-align:right;background:transparent;border:1px solid transparent;padding:4px 5px}
  .cellin:focus{border:1px solid var(--gold)}
  .bar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar>div{height:100%;border-radius:6px}
  .pchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin:3px 12px 3px 0}
  .pchip i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .pbtn{padding:5px 10px;border-radius:6px;border:none;font-size:12px;font-weight:600;background:transparent;color:var(--muted)}
  .pbtn.on{background:var(--gold);color:#000}
  .delx{background:none;border:none;color:var(--faint);font-size:15px}
  a{color:var(--gold)}
  @media(max-width:900px){.cols3,.cols2{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== 상태 ===================== */
const KEY="portfolio_v1";
const FXD={USD:1382,TWD:44};
const DEFAULT={
  rows:[
    {name:"삼성전자",code:"005930",sector:"반도체",market:"국내",cur:"KRW",qty:10,avg:300000,price:360500,prev:349000,hi52:400000,lo52:250000,date:"2024-03-15",target:35},
    {name:"SK하이닉스",code:"000660",sector:"반도체",market:"국내",cur:"KRW",qty:2,avg:1800000,price:2360000,prev:2363000,hi52:2500000,lo52:1200000,date:"2024-06-01",target:35},
    {name:"제주반도체",code:"080220",sector:"반도체",market:"국내",cur:"KRW",qty:30,avg:80000,price:101000,prev:98500,hi52:137100,lo52:12900,date:"2024-07-10",target:20},
  ],
  cash:1500000, fxUSD:FXD.USD, fxTWD:FXD.TWD, period:"YTD", calcCode:"000660", calcWeight:35,
  pricedAt:"", history:[], spxYtd:"", trades:[], txlog:[], txmemo:{}, account:"", cashlog:[], gsUrl:""
};
let S=load();
const REALIZED=[];
const PERIODS=["1일","1주","1달","YTD","1년","5년","전체"];

function load(){try{const j=localStorage.getItem(KEY);if(j)return Object.assign({},DEFAULT,JSON.parse(j));}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ===================== 유틸 ===================== */
const won=n=>"₩"+Math.round(n).toLocaleString("ko-KR");
const pct=n=>(n>=0?"+":"")+(+n).toFixed(2)+"%";
const ud=n=>n>=0?"var(--up)":"var(--down)";
const rate=c=>c==="USD"?S.fxUSD:c==="TWD"?S.fxTWD:1;
const fmtP=(c,v)=>c==="KRW"?(+v).toLocaleString():(c==="USD"?"$":"NT$")+(+v).toFixed(c==="TWD"?0:1);

function compute(){
  const sel=S.account||"";
  let src=(sel?S.rows.filter(x=>(x.account||"기본")===sel):S.rows).filter(x=>(+x.qty||0)>0);
  if(!sel){   // 전체(합산): 같은 종목코드를 한 줄로 합치고 평단가는 수량 가중평균
    const m={};
    src.forEach(x=>{const k=x.code; const q=+x.qty||0;
      if(!m[k]){ m[k]=Object.assign({},x,{qty:0,_cs:0,account:"합산"}); }
      m[k].qty+=q; m[k]._cs+=q*(+x.avg||0);
      if(+x.price) m[k].price=+x.price;
      if(+x.prev) m[k].prev=+x.prev;
      if(x.date && (!m[k].date || x.date<m[k].date)) m[k].date=x.date;   // 최초 매수일
    });
    src=Object.values(m).map(x=>{ x.avg=x.qty?Math.round(x._cs/x.qty):0; delete x._cs; return x; });
  }
  const r=src.map(raw=>{
    const s=Object.assign({},raw,{qty:+raw.qty||0,avg:+raw.avg||0,price:+raw.price||0,prev:+raw.prev||+raw.price||0});
    const k=rate(s.cur), priceK=s.price*k, avgK=s.avg*k, prevK=s.prev*k;
    const evalAmt=s.qty*priceK, cost=s.qty*avgK, pl=evalAmt-cost;
    const plPct=avgK?(priceK/avgK-1)*100:0;
    const dayChg=s.prev?(s.price-s.prev)/s.prev*100:0, dayPl=s.qty*(priceK-prevK);
    const days=Math.max(0,Math.round((Date.now()-new Date(s.date))/864e5));
    const range=s.hi52-s.lo52, pos52=range?((s.price-s.lo52)/range)*100:50;
    const fee=evalAmt*0.00015, tax=s.market==="국내"?evalAmt*0.0018:0;
    return Object.assign(s,{priceK,evalAmt,cost,pl,plPct,dayChg,dayPl,days,pos52:Math.max(0,Math.min(100,pos52)),netIfSold:pl-fee-tax});
  });
  const stockVal=r.reduce((a,x)=>a+x.evalAmt,0), totalCost=r.reduce((a,x)=>a+x.cost,0);
  const cashUsed=sel?0:+S.cash;
  const totalAsset=(stockVal+cashUsed)||1, totalPl=stockVal-totalCost;
  const totalPlPct=totalCost?(stockVal/totalCost-1)*100:0;
  const dayPl=r.reduce((a,x)=>a+x.dayPl,0);
  const realizedPl=realizedFromLog(sel);
  r.forEach(x=>{x.weight=x.evalAmt/totalAsset*100;});
  const sec={}; r.forEach(x=>{const sn=(!x.sector||/^\d+$/.test(String(x.sector)))?"기타":x.sector; sec[sn]=(sec[sn]||0)+x.evalAmt;});
  const sectors=Object.entries(sec).map(([n,v])=>({n,v,w:v/(stockVal||1)*100})).sort((a,b)=>b.v-a.v);
  const dom=r.filter(x=>x.market==="국내").reduce((a,x)=>a+x.evalAmt,0);
  return {r,stockVal,totalCost,totalAsset,totalPl,totalPlPct,dayPl,realizedPl,sectors,dom,ovs:stockVal-dom};
}

/* ===================== 차트(SVG/CSS) ===================== */
const PIE=["#e0b35c","#5b9bd5","#e07a5f","#81b29a","#c77dff","#f2a65e","#6c8ead","#9aa0a6"];
function donut(items){ // items:[{label,value,color}]
  const tot=items.reduce((a,x)=>a+x.value,0)||1; let ang=-90; const R=88,r=50,cx=100,cy=100; let p="";
  items.forEach(it=>{const a0=ang, a1=ang+it.value/tot*360; ang=a1;
    const rad=d=>d*Math.PI/180;
    const x0=cx+R*Math.cos(rad(a0)),y0=cy+R*Math.sin(rad(a0)),x1=cx+R*Math.cos(rad(a1)),y1=cy+R*Math.sin(rad(a1));
    const xi0=cx+r*Math.cos(rad(a1)),yi0=cy+r*Math.sin(rad(a1)),xi1=cx+r*Math.cos(rad(a0)),yi1=cy+r*Math.sin(rad(a0));
    const big=(a1-a0)>180?1:0;
    p+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${xi0} ${yi0} A${r} ${r} 0 ${big} 0 ${xi1} ${yi1} Z" fill="${it.color}"/>`;
  });
  return `<svg viewBox="0 0 200 200" width="100%" height="200">${p}</svg>`;
}
function spark(base,up){let v=base*(0.95+Math.random()*0.03);const a=[];for(let i=0;i<20;i++){v*=1+(Math.random()-0.48)*0.012;a.push(v);}a[19]=base;
  const mn=Math.min(...a),mx=Math.max(...a),w=64,h=26;
  const pts=a.map((x,i)=>`${i/19*w},${h-(x-mn)/(mx-mn||1)*h}`).join(" ");
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${up?'var(--up)':'var(--down)'}" stroke-width="1.5"/></svg>`;}
function recordHistory(asset,kospi,kosdaq){
  const d=new Date().toISOString().slice(0,10);
  const h=S.history||(S.history=[]);
  const last=h[h.length-1];
  if(last&&last.d===d){ last.asset=Math.round(asset); if(kospi)last.kospi=kospi; if(kosdaq)last.kosdaq=kosdaq; }
  else{ h.push({d,asset:Math.round(asset),kospi:kospi||(last?last.kospi:null),kosdaq:kosdaq||(last?last.kosdaq:null)}); }
  if(h.length>2000) h.splice(0,h.length-2000);
}
function cutoffDate(){
  const n=new Date(), p=S.period, c=new Date(n);
  if(p==="1일")c.setDate(n.getDate()-1);
  else if(p==="1주")c.setDate(n.getDate()-7);
  else if(p==="1달")c.setMonth(n.getMonth()-1);
  else if(p==="YTD")return new Date(n.getFullYear(),0,1);
  else if(p==="1년")c.setFullYear(n.getFullYear()-1);
  else if(p==="5년")c.setFullYear(n.getFullYear()-5);
  else return new Date(0);
  return c;
}
function trendData(){
  const h=(S.history||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(!h.length) return [];
  const cs=cutoffDate().toISOString().slice(0,10);
  let f=h.filter(x=>x.d>=cs);
  if(f.length<2) f=h.slice(-2);
  return f;
}
function trendSVG(which){   // 총자산(절대액) 곡선
  const data=trendData();
  if(data.length<2)
    return `<div style="height:180px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;text-align:center">아직 기록이 부족해요.<br>시세 새로고침하면 과거 시세로 곡선이 채워져요.</div>`;
  const vals=data.map(x=>x.asset);
  const mn=Math.min(...vals),mx=Math.max(...vals),w=320,h=180,pad=8;
  const pts=vals.map((v,i)=>`${pad+i/(vals.length-1)*(w-2*pad)},${h-pad-(v-mn)/(mx-mn||1)*(h-2*pad)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/></svg>`;
}
// 시간가중수익률(TWR) 지수: 입출금 영향 제거 → 원금 추가가 수익률에 안 잡힘
// 입출금은 '거래일이 아닌 날'에 생겨도 다음 기록일 구간으로 합산해 빼준다(폭등 버그 방지).
function twrIndex(){
  const h=(S.history||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const flows=(S.cashlog||[]).map(c=>({d:c.date||"",a:+c.amount||0})).filter(x=>x.d).sort((a,b)=>a.d<b.d?-1:1);
  let idx=1, prev=null, prevDate=null, fi=0; const out=[];
  h.forEach(p=>{
    let f=0;
    while(fi<flows.length && flows[fi].d<=p.d){ if(prevDate!=null && flows[fi].d>prevDate) f+=flows[fi].a; fi++; }  // (이전기록일, 현재기록일] 사이 입출금 합
    if(prev!=null&&prev>0){ idx*=(1+((p.asset-f)/prev-1)); }
    out.push({d:p.d, twr:idx, kospi:p.kospi, kosdaq:p.kosdaq, spx:p.spx});
    prev=p.asset; prevDate=p.d;
  });
  return out;
}
// 수익률 추이: 내 포트(원금대비 TWR) + 코스피/코스닥/S&P 겹쳐 그리기
function retChartHTML(){
  const tw=twrIndex();
  const cs=cutoffDate().toISOString().slice(0,10);
  let f=tw.filter(x=>x.d>=cs); if(f.length<2) f=tw.slice(-2);
  if(f.length<2) return `<div style="height:180px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;text-align:center">아직 기록이 부족해요.<br>시세 새로고침하면 채워져요.</div>`;
  const defs=[
    {name:"내 포트(원금대비)",col:"var(--gold)",val:x=>x.twr,wide:1},
    {name:"코스피",col:"#5b9bd5",val:x=>x.kospi},
    {name:"코스닥",col:"#81b29a",val:x=>x.kosdaq},
    {name:"S&P500",col:"#c77dff",val:x=>x.spx},
  ];
  const lines=[];
  defs.forEach(s=>{
    const raw=f.map(s.val); const bi=raw.findIndex(v=>v!=null&&!isNaN(v));
    if(bi<0) return; const base=raw[bi];
    lines.push({name:s.name,col:s.col,wide:s.wide,ret:raw.map(v=>(v==null||isNaN(v))?null:(v/base-1)*100)});
  });
  let all=[0]; lines.forEach(l=>l.ret.forEach(v=>{if(v!=null)all.push(v);}));
  const mn=Math.min(...all),mx=Math.max(...all),w=320,h=180,pad=8,n=f.length;
  const X=i=>pad+i/(n-1)*(w-2*pad), Y=v=>h-pad-(v-mn)/((mx-mn)||1)*(h-2*pad);
  let svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${Y(0)}" x2="${w-pad}" y2="${Y(0)}" stroke="var(--border)" stroke-dasharray="3 3"/>`;
  lines.forEach(l=>{ let segs=[],cur=[];
    l.ret.forEach((v,i)=>{ if(v==null){if(cur.length)segs.push(cur);cur=[];} else cur.push(`${X(i)},${Y(v)}`); });
    if(cur.length)segs.push(cur);
    segs.forEach(c=>{ svg+=`<polyline points="${c.join(' ')}" fill="none" stroke="${l.col}" stroke-width="${l.wide?2.5:1.3}"/>`; });
  });
  svg+=`</svg>`;
  const legend=lines.map(l=>{const last=[...l.ret].reverse().find(v=>v!=null); return `<span class="pchip"><i style="background:${l.col}"></i>${l.name} <b class="mono" style="color:${last>=0?'var(--up)':'var(--down)'}">${last==null?'-':pct(last)}</b></span>`;}).join("");
  return svg+`<div style="margin-top:6px">${legend}</div>`;
}
function benchData(){
  const ys=new Date(new Date().getFullYear(),0,1).toISOString().slice(0,10);
  const h=(S.history||[]).filter(x=>x.d>=ys).sort((a,b)=>a.d<b.d?-1:1);
  const out=[];
  if(h.length>=2&&h[0].asset) out.push({name:"내 포트",v:(h[h.length-1].asset/h[0].asset-1)*100,me:1});
  else out.push({name:"내 포트",v:null,me:1});
  const hk=h.filter(x=>x.kospi);
  if(hk.length>=2) out.push({name:"코스피(종합)",v:(hk[hk.length-1].kospi/hk[0].kospi-1)*100});
  else out.push({name:"코스피(종합)",v:null});
  const hq=h.filter(x=>x.kosdaq);
  if(hq.length>=2) out.push({name:"코스닥",v:(hq[hq.length-1].kosdaq/hq[0].kosdaq-1)*100});
  else out.push({name:"코스닥",v:null});
  const hs=h.filter(x=>x.spx);
  if(hs.length>=2) out.push({name:"S&P 500",v:(hs[hs.length-1].spx/hs[0].spx-1)*100});      // 자동(시세 재구성)
  else out.push({name:"S&P 500",v:(S.spxYtd!==""&&!isNaN(+S.spxYtd))?+S.spxYtd:null});       // 없으면 수동 입력값
  return out;
}

/* ===================== 렌더 ===================== */
function render(){
  const d=compute();
  const sel=S.account||"";
  const accts=[...new Set(S.rows.map(x=>x.account||"기본"))];
  const txAll=S.txlog||[];
  const txShown=sel?txAll.filter(t=>(t.account||"기본")===sel):txAll;
  // 매매일지 필터(종목검색/연·월) — 항상 주별로 구분
  const txStock=(S._txStock||"").trim(), txYear=S._txYear||"", txMon=S._txMon||"";
  const txNames=[...new Set(txShown.map(t=>t.name).filter(Boolean))].sort();
  const txYears=[...new Set(txShown.map(t=>(t.date||"").slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
  const txFiltered=txShown.filter(t=>
    (!txStock || (t.name||"").toLowerCase().includes(txStock.toLowerCase()) || (t.code||"")===txStock)
    && (!txYear || (t.date||"").slice(0,4)===txYear)
    && (!txMon || (t.date||"").slice(5,7)===txMon));
  const weekKey=ds=>{const dt=new Date(ds);if(isNaN(dt))return ds||"(날짜없음)";const o=new Date(dt);const day=(dt.getDay()+6)%7;o.setDate(dt.getDate()-day);return o.toISOString().slice(0,10)+" 주";};
  const groupKey=t=>weekKey(t.date);
  const txCtrl=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
    <input id="txStock" list="txStockList" value="${txStock.replace(/"/g,'&quot;')}" placeholder="🔍 종목 검색" style="width:140px;font-family:'Pretendard'">
    <datalist id="txStockList">${txNames.map(n=>`<option value="${String(n).replace(/"/g,'&quot;')}">`).join("")}</datalist>
    <select id="txYear"><option value="">전체 연도</option>${txYears.map(y=>`<option value="${y}" ${y===txYear?'selected':''}>${y}년</option>`).join("")}</select>
    <select id="txMon"><option value="">전체 월</option>${Array.from({length:12},(_,i)=>("0"+(i+1)).slice(-2)).map(m=>`<option value="${m}" ${m===txMon?'selected':''}>${+m}월</option>`).join("")}</select>
    ${(txStock||txYear||txMon)?`<button class="btn" id="txClear" style="padding:5px 10px">필터 해제</button>`:""}
  </div>`;
  // tbody rows (주별 그룹 헤더 포함). 최신순.
  const txRowsArr=txFiltered.slice().reverse();
  let txBody="", lastG=null;
  txRowsArr.forEach(t=>{
    const g=groupKey(t); if(g!==lastG){ lastG=g;
      const inG=txFiltered.filter(x=>groupKey(x)===g);
      const buy=inG.filter(x=>x.type==="매수").reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0);
      const sell=inG.filter(x=>x.type==="매도").reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0);
      txBody+=`<tr><td colspan="6" style="background:var(--panel2);font-weight:600;font-size:12px;color:var(--gold);padding:6px 10px">${g} · ${inG.length}건 · 매수 ${won(buy)} / 매도 ${won(sell)}</td></tr>`; }
    txBody+=`<tr>
      <td class="mono" style="color:var(--faint);font-size:12px">${t.date||"-"}</td>
      <td style="color:${t.type==='매수'?'var(--up)':'var(--down)'};font-weight:600">${t.type}</td>
      <td>${t.name}${sel?"":`<span style="font-size:10px;color:var(--faint);margin-left:5px">${t.account||"기본"}</span>`}</td>
      <td class="mono" style="text-align:right">${t.qty}</td>
      <td class="mono" style="text-align:right">${(+t.price).toLocaleString()}</td>

/* ===================== 동작 ===================== */
function up(code,field,val){const r=S.rows.find(x=>x.code===code);if(r){r[field]=val===""?"":+val;save();render();}}
function addTrade(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g("tName")||!g("tQty")||!g("tBuy")||!g("tSell")){alert("종목·수량·매수가·매도가를 모두 입력하세요.");return;}
  (S.trades||(S.trades=[])).push({name:g("tName"),qty:+g("tQty"),buy:+g("tBuy"),sell:+g("tSell"),date:new Date().toISOString().slice(0,10)});
  save();render();
}
function addRow(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g("nName"); if(!name||!g("nQty")||!g("nAvg")){alert("종목명·수량·매입단가는 필수입니다.");return;}

function tmpl(){const csv="종목명,종목코드,섹터,시장,통화,수량,매입단가,현재가,매입일,목표비중\n삼성전자,005930,반도체,국내,KRW,10,300000,360500,2024-03-15,35\n";dl(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}),"보유목록_양식.csv");}

function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function parseCSV(text){ // 따옴표·줄바꿈·콤마 처리
  text=text.replace(/^\uFEFF/,""); const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===',') {row.push(cur);cur="";}
      else if(ch==='\r'){} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur="";} else cur+=ch; }
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const numOf=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;};

function decodeCsvBuf(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder("euc-kr").decode(buf); }   // 증권사 파일은 보통 한글(EUC-KR/CP949)
}
const isDateStr=s=>/^\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}$/.test(String(s||"").trim());
// 거래내역(헤더 여러 줄 + 2줄=1거래) 형식인지 판별 (헤더가 위쪽 메타행 아래 있어도 인식)
function looksLikeTx(rows){
  const hdr=rows.slice(0,12).map(r=>r.join("")).join("").replace(/\s+/g,"");
  if(/거래종류|거래일자|거래번호|거래적요|주식매수|주식매도/.test(hdr)) return true;
  let dates=0; rows.forEach(r=>{ if(r.slice(0,3).some(c=>excelOrDate(c))) dates++; });
  const hasJango=rows.some(r=>String(r.join("")).replace(/\s+/g,"").includes("잔고수량"));
  return dates>=2 && !hasJango;
}
// 파일명에서 계좌 기본이름 추출 (...401 -> 계좌01, ...402 -> 계좌02)
function acctFromName(fileName){
  const m=String(fileName||"").match(/\d{4,}/g);
  if(m&&m.length){ const n=m.sort((a,b)=>b.length-a.length)[0]; return "계좌"+n.slice(-2); }
  return "";
}
// 엑셀 일련번호(46056) 또는 날짜문자열 → "YYYY-MM-DD"
function excelOrDate(v){
  const s=String(v).trim();
  if(/^\d+(\.\d+)?$/.test(s)){ const n=+s; if(n>=40000&&n<=80000){ const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000); return d.toISOString().slice(0,10); } }
  const m=s.match(/^(\d{4})[.\-/]\s?(\d{1,2})[.\-/]\s?(\d{1,2})/);
  return m?`${m[1]}-${("0"+m[2]).slice(-2)}-${("0"+m[3]).slice(-2)}`:"";
}
// 헤더 이름 기반 거래내역 파서 — 컬럼 위치가 달라도(예전 CSV / Super365 .xls) 다 읽음.
// 반환: {trades:[{date,type,code,name,qty,price,fee,seq}], cashflows:[{date,amount,desc,seq}]}
function parseTxRows(rows){
  const norm=s=>String(s).replace(/\s+/g,"");
  const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;};
  let hp=rows.findIndex(r=>r.some(c=>{const n=norm(c);return n==="거래일자"||n==="거래종류"||n==="거래적요";}));
  if(hp<0) hp=0;
  const HP=(rows[hp]||[]).map(norm), HQ=(rows[hp+1]||[]).map(norm);
  const inHdr=(h,...ns)=>{for(const n of ns){const i=h.indexOf(n);if(i>=0)return i;}return -1;};
  const both=(...ns)=>{let i=inHdr(HP,...ns);if(i>=0)return[0,i];i=inHdr(HQ,...ns);return i>=0?[1,i]:[-1,-1];};
  let dateCol=inHdr(HP,"거래일자"); if(dateCol<0)dateCol=0;
  let typeCol=inHdr(HP,"거래적요","거래종류","거래구분","적요"); if(typeCol<0)typeCol=2;
  let amtCol=inHdr(HP,"거래금액"); if(amtCol<0)amtCol=7;
  let noCol=HP.findIndex(c=>/거래(NO|No|번호)/.test(c)); if(noCol<0)noCol=1;
  let qtyCol=inHdr(HP,"수량"); if(qtyCol<0)qtyCol=4;
  let [cR,cC]=both("종목코드"); if(cC<0){cR=0;cC=3;}
  let [nR,nC]=both("종목명"); if(nC<0){nR=1;nC=3;}
  let [pR,pC]=both("단가"); if(pC<0){pR=1;pC=4;}
  let [fR,fC]=both("제세금","세금"); if(fC<0){fR=pR;fC=pC+1;}   // 못 찾으면 단가 옆 칸
  const trades=[], cashflows=[];
  for(let i=hp+1;i<rows.length;i++){
    const P=rows[i];
    const desc=norm(P[typeCol]);
    if(!/매수|매도|입금|출금/.test(desc)) continue;   // 거래적요로 거래 줄 식별 (날짜가 깨져도 인식)
    const Q=rows[i+1]||[];
    const date=excelOrDate(P[dateCol]);               // 날짜 못 읽으면 "" (보유 계산엔 지장 없음)
    const seq=String(P[noCol]||i).replace(/[^0-9]/g,"")||String(i);
    if(/매수|매도/.test(desc)){
      const type=/매수/.test(desc)?"매수":"매도";
      const code=String((cR?Q:P)[cC]||"").trim().replace(/^[Aa]/,"");
      const qty=num(P[qtyCol]); if(!code||!qty) continue;
      trades.push({date,type,code,name:String((nR?Q:P)[nC]||"").trim()||code,
        qty,price:num((pR?Q:P)[pC]),fee:num((fR?Q:P)[fC]),seq});
    }else if(/입금|출금/.test(desc)){
      const amt=num(P[amtCol])*(/출금/.test(desc)?-1:1);
      if(amt) cashflows.push({date,amount:amt,desc,seq});
    }
  }
  return {trades,cashflows};
}

    const head=rows[0].map(h=>h.replace(/\s+/g,""));

    const iCode=find("종목코드"), iName=find("종목명"),
          iQty=find("잔고수량","보유수량","수량"), iBuyAmt=find("매수금액"), iAvg=find("매입단가","평균단가"),
          iEval=find("평가금액"), iPrice=find("현재가"),
          iCur=find("통화"), iMkt=find("시장");

    const iAcct=find("계좌","계좌번호","계좌명","계좌구분","계좌별칭");
    let manualAcct=null;
    if(iAcct<0){
      const def=acctFromName(file.name)||(S.rows.find(r=>r.account)||{}).account||"계좌1";
      manualAcct=(prompt("이 잔고 파일은 어느 계좌인가요? 계좌 이름을 적어주세요. (예: 계좌01)\n\n* 계좌별로 파일을 따로 가져오면 각각/합산으로 볼 수 있어요.",def)||def).trim()||def;
    }
    const pTgt={},pSec={}; S.rows.forEach(r=>{pTgt[r.code]=r.target;pSec[r.code]=r.sector;});
    const agg={};
    rows.slice(1).forEach(c=>{
      const code=String(c[iCode]||"").trim().replace(/^[Aa]/,"");   // A000660 -> 000660
      if(!code||!/^\w+$/.test(code)) return;
      const qty=numOf(c[iQty]); if(!qty) return;
      const acct=iAcct>=0?(String(c[iAcct]||"").trim()||"기본"):manualAcct;
      const buy = iBuyAmt>=0?numOf(c[iBuyAmt]) : (iAvg>=0?numOf(c[iAvg])*qty:0);
      const evl = iEval>=0?numOf(c[iEval]) : (iPrice>=0?numOf(c[iPrice])*qty:buy);
      const key=acct+"|"+code;
      if(!agg[key]) agg[key]={code,account:acct,name:(c[iName]||code).trim(),qty:0,buy:0,evl:0,
        cur:iCur>=0?(c[iCur]||"KRW"):"KRW", market:iMkt>=0?(c[iMkt]||"국내"):"국내"};
      agg[key].qty+=qty; agg[key].buy+=buy; agg[key].evl+=evl;       // 같은 계좌 내 합산
    });
    const out=Object.values(agg).map(a=>{
      const avg=a.qty?a.buy/a.qty:0, price=a.qty?a.evl/a.qty:avg;       // 매입단가/현재가 = 금액÷수량
      return {name:a.name,code:a.code,account:a.account,sector:pSec[a.code]||"기타",market:a.market,cur:a.cur,
        qty:a.qty, avg:Math.round(avg), price:Math.round(price), prev:Math.round(price),
        hi52:Math.round(price*1.3), lo52:Math.round(price*0.7), date:"2024-01-01", target:pTgt[a.code]||0};
    });
    if(out.length){
      const importedAccts=new Set(out.map(r=>r.account));
      const kept=S.rows.filter(r=>!importedAccts.has(r.account||"기본"));   // 같은 계좌 기존행 교체, 다른 계좌는 유지
      S.rows=kept.concat(out); save(); render();
      alert(out.length+"개 종목을 불러왔어요. (계좌: "+[...importedAccts].join(", ")+")\n'↻ 시세 새로고침'을 누르면 국내 종목 현재가가 갱신됩니다."); }
    else throw 0;
  }catch(e){ alert("CSV를 읽지 못했어요.\n잔고 CSV 또는 거래내역 CSV가 맞는지 확인해주세요."); }};
  rd.readAsArrayBuffer(file);
}
function importTx(file){

    catch(e){ alert("거래내역 CSV를 읽지 못했어요.\n증권사 '거래내역' CSV가 맞는지 확인해주세요."); } };

// 로컬 거래내역 파일 가져오기 (헤더 기반 parseTxRows 사용)
function importTxRows(rows, fileName){
  const def=acctFromName(fileName)||((S.rows.find(r=>r.account)||{}).account)||(((S.txlog||[]).slice(-1)[0]||{}).account)||"계좌1";
  const acct=(prompt("이 거래내역 파일은 어느 계좌인가요? 계좌 이름을 적어주세요. (예: 계좌01)\n\n* 계좌별로 파일을 따로 가져오면 계좌별 매매일지/실현손익을 볼 수 있어요.",def)||def).trim()||def;
  const {trades,cashflows}=parseTxRows(rows);
  const seen={}; (S.txlog||(S.txlog=[])).forEach(t=>seen[t.txno]=1);
  const seenCf={}; (S.cashlog||(S.cashlog=[])).forEach(c=>seenCf[c.cfno]=1);
  let added=0, addedCf=0;
  trades.forEach(t=>{ const txno=acct+"|"+t.date+"_"+t.seq; if(seen[txno])return; seen[txno]=1;
    S.txlog.push({txno,account:acct,date:t.date,type:t.type,code:t.code,name:t.name,qty:t.qty,price:t.price,
      fee:t.type==="매수"?t.fee:0, tax:t.type==="매도"?t.fee:0}); added++; });
  cashflows.forEach(c=>{ const cfno=acct+"|cf|"+c.date+"_"+c.seq; if(seenCf[cfno])return; seenCf[cfno]=1;
    S.cashlog.push({cfno,account:acct,date:c.date,amount:c.amount,desc:c.desc}); addedCf++; });
  S.txlog.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  S.cashlog.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  save(); render();
  alert(added+"건의 매매 + 입출금 "+addedCf+"건을 불러왔어요. (계좌: "+acct+", 중복 제외)\n\n이제 '거래내역으로 보유 계산'을 누르면 현재 보유 종목이 자동으로 채워져요.");
}
// 평균단가 방식 실현손익 (txlog + 수동 trades)
function realizedFromLog(acct){
  const pos={}; let realized=0;
  (S.txlog||[]).filter(t=>!acct||(t.account||"기본")===acct).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{
    const p=pos[t.code]||(pos[t.code]=[0,0]);
    if(t.type==="매수"){ p[0]+=t.qty; p[1]+=t.qty*t.price+t.fee; }
    else{ const avg=p[0]?p[1]/p[0]:0; realized+=t.qty*(t.price-avg)-t.fee-t.tax; p[1]-=avg*t.qty; p[0]-=t.qty; }
  });
  if(!acct)(S.trades||[]).forEach(x=>realized+=(+x.qty)*((+x.sell)-(+x.buy)));
  return realized;
}
// txlog → 현재 보유 종목 배열 (매수-매도 누적, 평단가, 다 팔린 종목 제외)
function holdingsFromTx(){
  const log=(S.txlog||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const pSec={},pTgt={}; (S.rows||[]).forEach(r=>{if(r.sector)pSec[r.code]=r.sector;if(r.target)pTgt[r.code]=r.target;});
  const pos={};
  const pPx={}; (S.rows||[]).forEach(r=>{if(+r.price)pPx[r.code]=+r.price;});   // 직전 현재가 유지
  log.forEach(t=>{
    const acct=t.account||"기본", key=acct+"|"+t.code;
    const p=pos[key]||(pos[key]={code:t.code,account:acct,name:t.name||t.code,qty:0,cost:0,cur:t.cur||"KRW"});
    if(t.name)p.name=t.name; if(t.cur)p.cur=t.cur;
    if(t.type==="매수"){p.qty+=(+t.qty||0); p.cost+=(+t.qty||0)*(+t.price||0)+(+t.fee||0);}
    else{const avg=p.qty?p.cost/p.qty:0; p.cost-=avg*(+t.qty||0); p.qty-=(+t.qty||0);}
  });
  return Object.values(pos).filter(p=>p.qty>1e-6).map(p=>{
    const avg=Math.round(p.cost/p.qty), price=pPx[p.code]||avg, cur=p.cur||"KRW";
    return {name:p.name,code:p.code,account:p.account,sector:pSec[p.code]||"기타",
      market:(cur!=="KRW")?"해외":(/^\d{6}$/.test(p.code)?"국내":"해외"),cur,
      qty:Math.round(p.qty*1e4)/1e4,avg,price,prev:price,
      hi52:Math.round(price*1.3),lo52:Math.round(price*0.7),date:"2024-01-01",target:pTgt[p.code]||0};
  });
}
// 거래내역(txlog)만으로 현재 보유 종목·평단가를 재구성 (잔고 CSV 불필요)

  if(!confirm("가져온 거래내역으로 현재 보유 종목을 다시 계산할까요?\n\n· 기존 보유 목록은 대체됩니다\n· 다 팔린 종목은 자동으로 빠져요\n· 계산 후 '↻ 시세 새로고침'을 누르면 현재가가 채워집니다"))return;
  const out=holdingsFromTx();
  if(!out.length){alert("거래내역상 현재 보유 중인 종목이 없어요. (전부 매도된 상태)");return;}
  S.rows=out; save(); render();
  const accts=[...new Set(out.map(r=>r.account))].join(", ");
  alert(out.length+"개 종목을 거래내역으로 계산했어요. (계좌: "+accts+")\n'↻ 시세 새로고침'을 누르면 현재가가 채워집니다.\n※ 평단가는 가져온 거래내역 범위 안에서만 정확해요.");
}

/* ===================== 구글 시트에서 거래내역 불러오기 (URL 하나 → 모든 탭=계좌) ===================== */
// Apps Script는 브라우저 fetch가 CORS로 막히므로 JSONP(<script>)로 호출
function jsonpGet(url, timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb="__pf_cb_"+Date.now()+Math.floor(Math.random()*1e6);
    const s=document.createElement("script"); let done=false;
    const clean=()=>{ try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); };
    window[cb]=d=>{ done=true; clean(); resolve(d); };
    s.onerror=()=>{ if(done)return; clean(); reject(new Error("스크립트 로드 실패 (URL/배포/인터넷 확인)")); };
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&_t="+Date.now();
    document.body.appendChild(s);
    setTimeout(()=>{ if(done)return; clean(); reject(new Error("응답 시간 초과")); }, timeoutMs||20000);
  });
}
// Apps Script 웹앱(doGet)이 시트의 모든 탭을 JSON으로 내려줌. 탭 이름 = 계좌 이름.
async function loadFromSheets(){
  if(!S.gsUrl){ if(!gsSetup()) return; }
  let data;
  try{ data=await jsonpGet(S.gsUrl, 20000); }
  catch(e){
    alert("시트에서 못 읽었어요: "+e.message+"\n\n확인:\n· google_apps_script.gs 최신 코드(JSONP 지원)로 '새 버전' 배포했는지\n  (배포 → 배포 관리 → ✏️편집 → 버전: 새 버전 → 배포)\n· 웹앱 액세스가 '모든 사용자'인지\n· 인터넷 연결\n\n(확인을 누르면 URL을 다시 입력할 수 있어요)");
    gsSetup(); return;
  }
  const tabs=(data&&data.tabs)||[];
  const allTx=[], allCf=[], accts=[], skipped=[];
  tabs.forEach(tb=>{
    const acct=(tb.name||"기본").trim()||"기본";
    if(!tb.rows||!looksLikeTx(tb.rows)){ skipped.push(acct); return; }   // 거래내역처럼 안 생긴 탭은 건너뜀
    accts.push(acct);
    const {trades,cashflows}=parseTxRows(tb.rows);
    trades.forEach(t=>allTx.push({txno:acct+"|"+t.date+"_"+t.seq,account:acct,date:t.date,type:t.type,code:t.code,name:t.name,qty:t.qty,price:t.price,fee:t.type==="매수"?t.fee:0,tax:t.type==="매도"?t.fee:0}));
    cashflows.forEach(c=>allCf.push({cfno:acct+"|cf|"+c.date+"_"+c.seq,account:acct,date:c.date,amount:c.amount,desc:c.desc}));
  });
  if(!allTx.length){
    let diag="";
    const tb=tabs[0];
    if(!tabs.length) diag="\n\n[진단] 시트 탭을 못 받음(tabs 비어있음).";
    else{ const rws=(tb&&tb.rows)||[];
      diag="\n\n[진단]\n탭수="+tabs.length+", 첫탭='"+(tb&&tb.name)+"', 행수="+rws.length+", tx판정="+looksLikeTx(rws)
        +"\n헤더行0="+JSON.stringify((rws[0]||[]).slice(0,8))
        +"\n샘플行2="+JSON.stringify((rws[2]||rws[1]||[]).slice(0,8));
    }
    alert("시트에서 거래내역을 찾지 못했어요."+(skipped.length?"\n건너뛴 탭: "+skipped.join(", "):"")+diag
      +"\n\n이 [진단] 내용을 그대로 복사해서 알려주시면 바로 고쳐드려요."); return; }
  allTx.sort((a,b)=>a.date<b.date?-1:1); allCf.sort((a,b)=>a.date<b.date?-1:1);
  S.txlog=allTx; S.cashlog=allCf; S.rows=holdingsFromTx();
  save(); render();
  alert("시트에서 매매 "+allTx.length+"건·입출금 "+allCf.length+"건을 불러와 보유종목을 계산했어요.\n계좌(탭): "+accts.join(", ")+"\n\n'↻ 시세 새로고침'으로 현재가를 채우세요.");
}

/* ===================== 구글 시트 백업 (Apps Script 웹앱) ===================== */
// 월별 요약: 자산추이(월말 평가액) + 입출금 로그로 평가액/입출금/수익금/수익률 계산
function monthlySummary(){
  const h=(S.history||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const lastByMonth={}; h.forEach(x=>{ lastByMonth[x.d.slice(0,7)]=x.asset; });   // 그 달 마지막 기록
  const flowByMonth={}; (S.cashlog||[]).forEach(c=>{const m=(c.date||"").slice(0,7); flowByMonth[m]=(flowByMonth[m]||0)+(+c.amount||0);});
  const months=[...new Set([...Object.keys(lastByMonth),...Object.keys(flowByMonth)])].sort();
  let prev=null; const out=[];
  months.forEach(m=>{
    const asset=lastByMonth[m]!=null?lastByMonth[m]:null, flow=flowByMonth[m]||0;
    let profit=null, ret=null;
    if(asset!=null&&prev!=null){ profit=asset-prev-flow; ret=asset?profit/asset*100:null; }   // 수익금 = Δ평가액 − 입출금
    out.push({month:m,asset,flow,profit,ret});
    if(asset!=null) prev=asset;
  });
  return out;
}
function gsPayload(){
  const holdings=[["계좌","종목명","종목코드","통화","수량","평단가","현재가","평가금액(원)","수익률%","섹터","시장"]];
  (S.rows||[]).forEach(r=>{const k=rate(r.cur),evalAmt=(+r.qty||0)*(+r.price||0)*k,cost=(+r.qty||0)*(+r.avg||0)*k,ret=cost?(evalAmt/cost-1)*100:0;
    holdings.push([r.account||"기본",r.name,r.code,r.cur,+r.qty||0,+r.avg||0,+r.price||0,Math.round(evalAmt),+ret.toFixed(2),r.sector||"",r.market||""]);});
  const txlog=[["날짜","계좌","구분","종목명","종목코드","수량","단가","수수료","세금","메모"]];
  (S.txlog||[]).forEach(t=>txlog.push([t.date,t.account||"기본",t.type,t.name,t.code,+t.qty||0,+t.price||0,+t.fee||0,+t.tax||0,(S.txmemo&&S.txmemo[t.txno])||""]));
  const history=[["날짜","총자산","코스피","코스닥"]];
  (S.history||[]).forEach(x=>history.push([x.d,x.asset,x.kospi||"",x.kosdaq||""]));
  const cashlog=[["날짜","계좌","입출금액(+입금/−출금)","구분"]];
  (S.cashlog||[]).forEach(c=>cashlog.push([c.date,c.account||"기본",+c.amount||0,c.desc||""]));
  const monthly=[["년월","평가액","입출금","수익금","수익률%"]];
  monthlySummary().forEach(m=>monthly.push([m.month,m.asset==null?"":Math.round(m.asset),Math.round(m.flow),m.profit==null?"":Math.round(m.profit),m.ret==null?"":+m.ret.toFixed(2)]));
  const meta=[["항목","값"],["백업시각",new Date().toLocaleString("ko-KR")],["시세갱신",S.pricedAt||""],["현금",+S.cash||0],
    ["계좌",[...new Set((S.rows||[]).map(r=>r.account||"기본"))].join(", ")]];
  return {holdings,txlog,history,cashlog,monthly,meta};
}
function gsSetup(){
  const url=prompt("구글 Apps Script 웹앱 URL을 붙여넣어 주세요.\n이 URL 하나로 '시트에서 불러오기'(읽기)와 '구글시트 백업'(쓰기)을 다 해요.\n(만드는 법: README의 '구글 시트 연동' — google_apps_script.gs 코드 사용)\n\n예: https://script.google.com/macros/s/AKfy.../exec",S.gsUrl||"");
  if(url==null) return false;
  S.gsUrl=url.trim(); save();
  return !!S.gsUrl;
}
async function gsBackup(){
  if(!S.gsUrl){ if(!gsSetup())return; }
  try{
    await fetch(S.gsUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(gsPayload())});
    alert("구글 시트로 백업을 보냈어요. ✅\n시트에서 '보유종목 · 거래내역 · 자산추이 · 입출금 · 월별요약' 탭을 확인해보세요.\n(보안상 전송 결과는 시트에서 직접 확인돼요)");
  }catch(e){ alert("백업 전송에 실패했어요.\n인터넷 연결과 시트 URL(…/exec)을 확인해주세요.\n'시트연결' 버튼으로 URL을 다시 넣을 수 있어요."); }
}

/* 이벤트 위임 (#app은 재렌더돼도 유지됨) */
const app=document.getElementById("app");
app.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.code&&t.dataset.field){up(t.dataset.code,t.dataset.field,t.value);}
  else if(t.id==="cash"){S.cash=+t.value||0;save();render();}
  else if(t.id==="calcCode"){S.calcCode=t.value;save();render();}
  else if(t.id==="calcWeight"){S.calcWeight=+t.value||0;save();render();}
  else if(t.id==="spxYtd"){S.spxYtd=t.value.trim();save();render();}
  else if(t.dataset.memo){ (S.txmemo||(S.txmemo={}))[t.dataset.memo]=t.value; save(); }
  else if(t.id==="txStock"){S._txStock=t.value;render();}
  else if(t.id==="txYear"){S._txYear=t.value;render();}
  else if(t.id==="txMon"){S._txMon=t.value;render();}
});
app.addEventListener("click",e=>{const t=e.target;
  if(t.dataset.del){if(confirm("삭제할까요?")){S.rows=S.rows.filter(x=>x.code!==t.dataset.del);save();render();}}
  else if(t.dataset.tdel!==undefined){S.trades.splice(+t.dataset.tdel,1);save();render();}
  else if(t.dataset.period){S.period=t.dataset.period;save();render();}
  else if(t.dataset.acct!==undefined){S.account=t.dataset.acct==="__ALL__"?"":t.dataset.acct;save();render();}
  else if(t.dataset.delacct!==undefined){const a=t.dataset.delacct;
    if(confirm("'"+a+"' 계좌를 삭제할까요?\n이 계좌의 보유종목과 거래내역이 모두 지워집니다. (다른 계좌는 그대로)")){
      S.rows=(S.rows||[]).filter(r=>(r.account||"기본")!==a);
      (S.txlog||[]).forEach(t2=>{if((t2.account||"기본")===a&&S.txmemo)delete S.txmemo[t2.txno];});
      S.txlog=(S.txlog||[]).filter(t2=>(t2.account||"기본")!==a);
      S.cashlog=(S.cashlog||[]).filter(c=>(c.account||"기본")!==a);
      if(S.account===a)S.account=""; save();render();}}
  else if(t.id==="resetBtn"){
    if(confirm("모든 보유종목·거래내역·매매일지를 비울까요?\n(현금/환율/추이 기록은 유지됩니다. 시트에서 불러오기로 다시 채울 수 있어요)")){
      S.rows=[]; S.txlog=[]; S.txmemo={}; S.trades=[]; S.cashlog=[]; S.account=""; save();render();}}
  else if(t.id==="addBtn")addRow();
  else if(t.id==="mAdd")addManualTx();
  else if(t.id==="rebuildBtn")rebuildFromTx();
  else if(t.id==="txClear"){S._txStock="";S._txYear="";S._txMon="";render();}
  else if(t.id==="tradeBtn")addTrade();
  else if(t.id==="refreshBtn")refreshPrices();
  else if(t.id==="gsBackupBtn")gsBackup();
  else if(t.id==="sheetLoadBtn")loadFromSheets();
});

// 첫 로드 시에도 오늘 총자산을 한 번 기록 (곡선 시작점 확보)
try{ const _a=S.account; S.account=""; const _f=compute().totalAsset; S.account=_a; recordHistory(_f, null); save(); }catch(e){}
render();
